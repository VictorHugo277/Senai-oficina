<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Oficina - Customizável</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px; 
            margin: 0;
            overflow-x: auto; 
        }
        
        #sala { 
            width: 500px; 
            height: 400px; 
            background-color: #e0e0e0; 
            border: 4px solid #333; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2); 
            margin-top: 10px;
            background-image: linear-gradient(#ccc 1px, transparent 1px), linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 50px 50px; 
            touch-action: none; 
        }
        
        .item { 
            background-color: #2c3e50; 
            position: absolute; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: bold; 
            color: white; 
            cursor: grab; 
            user-select: none; 
            border-radius: 2px; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid transparent;
        }
        
        .item.selecionado {
            border: 2px solid #e74c3c;
            filter: brightness(1.2); 
            z-index: 500;
        }

        .controles {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 95%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        
        .linha-input { display: flex; gap: 5px; align-items: center; }
        .linha-input input[type="text"], .linha-input input[type="number"], .linha-input select { flex: 1; padding: 8px; border: 1px solid #aaa; border-radius: 4px; font-size: 14px;}
        .linha-input input[type="color"] { width: 50px; height: 36px; padding: 0; border: 1px solid #aaa; border-radius: 4px; cursor: pointer; }
        
        button { 
            padding: 10px; 
            cursor: pointer; 
            border: none; 
            background-color: #27ae60; 
            color: white; 
            font-weight: bold; 
            border-radius: 5px; 
            font-size: 14px;
        }
        button.sala-btn { background-color: #34495e; }
        button.girar-btn { background-color: #e67e22; }
        button.duplicar-btn { background-color: #2980b9; } 
        button.remover-btn { background-color: #c0392b; }
        button.exportar-btn { background-color: #8e44ad; }
        button.importar-btn { background-color: #9b59b6; }
        
        .aviso { font-size: 12px; color: #555; text-align: center; }
        .botoes-acao { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .botoes-partilha { display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

    <h2>Simulador de Oficina Dinâmico</h2>
    <div class="aviso" id="infoSala">Sala atual: 10m x 8m</div>
    
    <div class="controles">
        <strong>⚙️ Configurar Tamanho da Sala:</strong>
        <div class="linha-input">
            <input type="number" id="larguraSala" placeholder="Largura (m)" value="10" step="0.5">
            <input type="number" id="comprimentoSala" placeholder="Comprimento (m)" value="8" step="0.5">
        </div>
        <button class="sala-btn" onclick="redimensionarSala()">Atualizar Tamanho da Sala</button>

        <hr style="width: 100%; border: 0.5px solid #eee;">

        <strong>➕ Criar Novo Item:</strong>
        <div class="linha-input">
            <input type="text" id="nomeItem" placeholder="Nome (ex: Torno)">
            <input type="color" id="corItem" value="#3498db" title="Cor">
        </div>
        <div class="linha-input">
            <input type="number" id="larguraItem" placeholder="Largura">
            <input type="number" id="comprimentoItem" placeholder="Comprimento">
            <select id="unidadeItem">
                <option value="m">Metros (m)</option>
                <option value="cm" selected>Centímetros (cm)</option>
                <option value="mm">Milímetros (mm)</option>
            </select>
        </div>
        <button onclick="adicionarItem()">Adicionar à Sala</button>
        
        <hr style="width: 100%; border: 0.5px solid #eee;">
        
        <div class="botoes-acao">
            <button class="girar-btn" onclick="girarItemSelecionado()">↻ Girar (90°)</button>
            <button class="duplicar-btn" onclick="duplicarItemSelecionado()">➕ Duplicar</button>
            <button class="remover-btn" style="grid-column: span 2;" onclick="removerItemSelecionado()">🗑️ Remover Selecionado</button>
        </div>

        <hr style="width: 100%; border: 0.5px solid #eee;">
        
        <strong>Partilhar Layout:</strong>
        <div class="botoes-partilha">
            <button class="exportar-btn" onclick="exportarLayout()">📤 Gerar Código Ultracurto</button>
            <button class="importar-btn" onclick="importarLayout()">📥 Colar Código Ultracurto</button>
        </div>
    </div>

    <div id="sala">
        <div class="item" style="top: 20px; left: 20px; width: 29.5px; height: 18px; background-color: #2c3e50;" data-angle="0" data-w="59" data-h="36">B1</div>
        <div class="item" style="top: 20px; left: 60px; width: 29.5px; height: 18px; background-color: #2c3e50;" data-angle="0" data-w="59" data-h="36">B2</div>
        <div class="item" style="top: 20px; left: 100px; width: 29.5px; height: 18px; background-color: #2c3e50;" data-angle="0" data-w="59" data-h="36">B3</div>
        <div class="item" style="top: 20px; left: 140px; width: 29.5px; height: 18px; background-color: #2c3e50;" data-angle="0" data-w="59" data-h="36">B4</div>
    </div>

    <script>
        let itemArrastado = null;
        let itemSelecionado = null;
        let lastX = 0; 
        let lastY = 0;
        
        // Dimensões da sala em metros
        let salaMetrosL = 10;
        let salaMetrosC = 8;
        
        // Fator de escala dinâmico (calculado com base no tamanho da sala para caber no visor de 500x400px)
        function obterEscala() {
            const pxL = 500 / salaMetrosL; // Pixels por metro na largura
            const pxC = 400 / salaMetrosC; // Pixels por metro no comprimento
            return Math.min(pxL, pxC);
        }

        function redimensionarSala() {
            const l = parseFloat(document.getElementById('larguraSala').value);
            const c = parseFloat(document.getElementById('comprimentoSala').value);
            
            if (!l || !c || l <= 0 || c <= 0) {
                return alert("Insira valores válidos para a sala!");
            }
            
            salaMetrosL = l;
            salaMetrosC = c;
            
            document.getElementById('infoSala').innerText = `Sala atual: ${l}m x ${c}m`;
            
            // Redesenha e reposiciona os itens com base na nova escala
            atualizarTamanhosVisuais();
        }

        function atualizarTamanhosVisuais() {
            const escalaAtual = obterEscala();
            const itens = document.querySelectorAll('#sala .item');
            
            itens.forEach(item => {
                const wCm = parseFloat(item.getAttribute('data-wcm')) || 59;
                const hCm = parseFloat(item.getAttribute('data-hcm')) || 36;
                
                // Converte cm para metros e multiplica pela nova escala em pixels
                item.style.width = (wCm / 100 * escalaAtual) + 'px';
                item.style.height = (hCm / 100 * escalaAtual) + 'px';
            });
        }

        function selecionar(elemento) {
            if (itemSelecionado) itemSelecionado.classList.remove('selecionado');
            itemSelecionado = elemento;
            if (itemSelecionado) itemSelecionado.classList.add('selecionado');
        }

        function iniciarArraste(e) {
            if (e.target.classList.contains('item')) {
                itemArrastado = e.target;
                selecionar(itemArrastado);
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                lastX = clientX;
                lastY = clientY;
                itemArrastado.style.zIndex = 1000;
            }
        }

        function arrastar(e) {
            if (!itemArrastado) return;
            e.preventDefault(); 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const dx = clientX - lastX;
            const dy = clientY - lastY;
            
            let currentLeft = parseFloat(itemArrastado.style.left) || 0;
            let currentTop = parseFloat(itemArrastado.style.top) || 0;
            
            itemArrastado.style.left = (currentLeft + dx) + 'px';
            itemArrastado.style.top = (currentTop + dy) + 'px';
            
            lastX = clientX;
            lastY = clientY;
        }

        function pararArraste() {
            if (itemArrastado) {
                itemArrastado.style.zIndex = 1;
                itemArrastado = null;
            }
        }

        const sala = document.getElementById('sala');
        sala.addEventListener('mousedown', iniciarArraste);
        document.addEventListener('mousemove', arrastar);
        document.addEventListener('mouseup', pararArraste);
        sala.addEventListener('touchstart', iniciarArraste, {passive: false});
        document.addEventListener('touchmove', arrastar, {passive: false});
        document.addEventListener('touchend', pararArraste);

        function girarItemSelecionado() {
            if (!itemSelecionado) return alert("Selecione um item primeiro!");
            let anguloAtual = parseInt(itemSelecionado.getAttribute('data-angle')) || 0;
            let novoAngulo = anguloAtual + 90;
            if (novoAngulo === 360) novoAngulo = 0;
            itemSelecionado.style.transform = `rotate(${novoAngulo}deg)`;
            itemSelecionado.setAttribute('data-angle', novoAngulo);
        }

        function removerItemSelecionado() {
            if (!itemSelecionado) return alert("Selecione um item primeiro!");
            if (confirm("Deseja mesmo remover este item?")) {
                itemSelecionado.remove(); 
                itemSelecionado = null;   
            }
        }

        function duplicarItemSelecionado() {
            if (!itemSelecionado) return alert("Selecione um item primeiro!");
            const clone = document.createElement('div');
            clone.className = 'item';
            clone.innerText = itemSelecionado.innerText;
            
            const wCm = itemSelecionado.getAttribute('data-wcm');
            const hCm = itemSelecionado.getAttribute('data-hcm');
            clone.setAttribute('data-wcm', wCm);
            clone.setAttribute('data-hcm', hCm);
            
            const escalaAtual = obterEscala();
            clone.style.width = (wCm / 100 * escalaAtual) + 'px';
            clone.style.height = (hCm / 100 * escalaAtual) + 'px';
            clone.style.backgroundColor = itemSelecionado.style.backgroundColor;
            
            const angulo = itemSelecionado.getAttribute('data-angle');
            clone.setAttribute('data-angle', angulo);
            clone.style.transform = `rotate(${angulo}deg)`;

            let currentLeft = parseFloat(itemSelecionado.style.left) || 0;
            let currentTop = parseFloat(itemSelecionado.style.top) || 0;
            clone.style.left = (currentLeft + 20) + 'px';
            clone.style.top = (currentTop + 20) + 'px';
            
            sala.appendChild(clone);
            selecionar(clone);
        }

        function adicionarItem() {
            const nome = document.getElementById('nomeItem').value || "Item";
            const cor = document.getElementById('corItem').value;
            let valorLargura = parseFloat(document.getElementById('larguraItem').value);
            let valorComprimento = parseFloat(document.getElementById('comprimentoItem').value);
            const unidade = document.getElementById('unidadeItem').value;
            
            if (!valorLargura || !valorComprimento) return alert("Preencha as medidas!");
            
            // Converte tudo internamente para centímetros
            let larguraCm = valorLargura;
            let comprimentoCm = valorComprimento;
            
            if (unidade === 'm') {
                larguraCm = valorLargura * 100;
                comprimentoCm = valorComprimento * 100;
            } else if (unidade === 'mm') {
                larguraCm = valorLargura / 10;
                comprimentoCm = valorComprimento / 10;
            }
            
            const escalaAtual = obterEscala();
            const novoElemento = document.createElement('div');
            novoElemento.className = 'item';
            novoElemento.innerText = nome;
            novoElemento.setAttribute('data-angle', '0');
            novoElemento.setAttribute('data-wcm', larguraCm);
            novoElemento.setAttribute('data-hcm', comprimentoCm);
            
            novoElemento.style.width = (larguraCm / 100 * escalaAtual) + 'px';
            novoElemento.style.height = (comprimentoCm / 100 * escalaAtual) + 'px';
            novoElemento.style.left = '150px';
            novoElemento.style.top = '150px';
            novoElemento.style.backgroundColor = cor;
            
            sala.appendChild(novoElemento);
            selecionar(novoElemento);
            
            document.getElementById('nomeItem').value = '';
            document.getElementById('larguraItem').value = '';
            document.getElementById('comprimentoItem').value = '';
        }

        function exportarLayout() {
            const itens = document.querySelectorAll('#sala .item');
            let arrayDados = [salaMetrosL, salaMetrosC]; // Guarda o tamanho da sala no início
            
            itens.forEach(item => {
                arrayDados.push([
                    item.innerText,
                    item.getAttribute('data-wcm') || "59",
                    item.getAttribute('data-hcm') || "36",
                    Math.round(parseFloat(item.style.top) || 0),
                    Math.round(parseFloat(item.style.left) || 0),
                    item.style.backgroundColor,
                    item.getAttribute('data-angle') || "0"
                ]);
            });

            const textoJson = JSON.stringify(arrayDados);
            const codigoCurtissimo = btoa(encodeURIComponent(textoJson));
            
            prompt("Código ultracurto (copie e envie no WhatsApp):", codigoCurtissimo);
        }

        function importarLayout() {
            const codigo = prompt("Cole aqui o código ultracurto:");
            if (!codigo) return; 
            
            try {
                const textoJson = decodeURIComponent(atob(codigo.trim()));
                const dadosLidos = JSON.parse(textoJson);
                
                // Os dois primeiros valores correspondem ao tamanho da sala
                salaMetrosL = dadosLidos[0];
                salaMetrosC = dadosLidos[1];
                
                document.getElementById('larguraSala').value = salaMetrosL;
                document.getElementById('comprimentoSala').value = salaMetrosC;
                document.getElementById('infoSala').innerText = `Sala atual: ${salaMetrosL}m x ${salaMetrosC}m`;
                
                const sala = document.getElementById('sala');
                sala.innerHTML = ""; 
                itemSelecionado = null; 
                
                const escalaAtual = obterEscala();
                
                // O resto do array são os itens
                for (let i = 2; i < dadosLidos.length; i++) {
                    const p = dadosLidos[i];
                    const novoElemento = document.createElement('div');
                    novoElemento.className = 'item';
                    novoElemento.innerText = p[0];
                    novoElemento.setAttribute('data-wcm', p[1]);
                    novoElemento.setAttribute('data-hcm', p[2]);
                    novoElemento.style.top = p[3] + 'px';
                    novoElemento.style.left = p[4] + 'px';
                    novoElemento.style.backgroundColor = p[5];
                    novoElemento.setAttribute('data-angle', p[6]);
                    novoElemento.style.transform = `rotate(${p[6]}deg)`;
                    
                    novoElemento.style.width = (p[1] / 100 * escalaAtual) + 'px';
                    novoElemento.style.height = (p[2] / 100 * escalaAtual) + 'px';
                    
                    sala.appendChild(novoElemento);
                }
                
                alert("Layout e tamanho da sala carregados com sucesso!");
            } catch (erro) {
                alert("Erro ao carregar o código. Certifique-se de copiar o texto inteiro.");
            }
        }
    </script>
</body>
</html>
