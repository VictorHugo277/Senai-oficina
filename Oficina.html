<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Oficina - 10x8m</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px; 
            margin: 0;
            overflow-x: auto; 
        }
        
        /* A sala: 500px (10m) x 400px (8m) -> Escala: 1cm = 0.5px */
        #sala { 
            width: 500px; 
            height: 400px; 
            background-color: #e0e0e0; 
            border: 4px solid #333; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2); 
            margin-top: 10px;
            background-image: linear-gradient(#ccc 1px, transparent 1px), linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 50px 50px; 
            touch-action: none; 
        }
        
        .item { 
            background-color: #2c3e50; 
            position: absolute; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: bold; 
            color: white; 
            cursor: grab; 
            user-select: none; 
            border-radius: 2px; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid transparent;
        }
        
        .item.selecionado {
            border: 2px solid #e74c3c;
            background-color: #1a252f;
            z-index: 500;
        }

        .controles {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 95%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        
        .linha-input { display: flex; gap: 5px; }
        .linha-input input { flex: 1; padding: 8px; border: 1px solid #aaa; border-radius: 4px; font-size: 14px;}
        
        button { 
            padding: 10px; 
            cursor: pointer; 
            border: none; 
            background-color: #27ae60; 
            color: white; 
            font-weight: bold; 
            border-radius: 5px; 
            font-size: 14px;
        }
        button.girar-btn { background-color: #e67e22; }
        button.remover-btn { background-color: #c0392b; } /* Estilo do botão de remover */
        
        .aviso { font-size: 12px; color: #555; text-align: center; }
    </style>
</head>
<body>

    <h2>Simulador - Oficina 10x8m</h2>
    <div class="aviso">Cada quadrado do chão equivale a 1 metro.</div>
    
    <div class="controles">
        <strong>Criar Novo Item (Insira em centímetros):</strong>
        <div class="linha-input">
            <input type="text" id="nomeItem" placeholder="Nome (ex: Torno)">
        </div>
        <div class="linha-input">
            <input type="number" id="larguraItem" placeholder="Largura cm (ex: 200)">
            <input type="number" id="comprimentoItem" placeholder="Comp. cm (ex: 80)">
        </div>
        <button onclick="adicionarItem()">+ Adicionar Item à Sala</button>
        <hr style="width: 100%; border: 0.5px solid #eee;">
        
        <button class="girar-btn" onclick="girarItemSelecionado()">↻ Girar Item Selecionado (90°)</button>
        <button class="remover-btn" onclick="removerItemSelecionado()">🗑️ Remover Item Selecionado</button>
    </div>

    <div id="sala">
        <div class="item" style="top: 20px; left: 20px; width: 29.5px; height: 18px;" data-angle="0">B1</div>
        <div class="item" style="top: 20px; left: 60px; width: 29.5px; height: 18px;" data-angle="0">B2</div>
        <div class="item" style="top: 20px; left: 100px; width: 29.5px; height: 18px;" data-angle="0">B3</div>
        <div class="item" style="top: 20px; left: 140px; width: 29.5px; height: 18px;" data-angle="0">B4</div>
    </div>

    <script>
        let itemArrastado = null;
        let itemSelecionado = null;
        let lastX = 0; 
        let lastY = 0;
        const ESCALA = 0.5; // 1 cm = 0.5 pixels

        function selecionar(elemento) {
            if (itemSelecionado) itemSelecionado.classList.remove('selecionado');
            itemSelecionado = elemento;
            itemSelecionado.classList.add('selecionado');
        }

        function iniciarArraste(e) {
            if (e.target.classList.contains('item')) {
                itemArrastado = e.target;
                selecionar(itemArrastado);
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                lastX = clientX;
                lastY = clientY;
                itemArrastado.style.zIndex = 1000;
            }
        }

        function arrastar(e) {
            if (!itemArrastado) return;
            e.preventDefault(); 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const dx = clientX - lastX;
            const dy = clientY - lastY;
            
            let currentLeft = parseFloat(itemArrastado.style.left) || 0;
            let currentTop = parseFloat(itemArrastado.style.top) || 0;
            
            itemArrastado.style.left = (currentLeft + dx) + 'px';
            itemArrastado.style.top = (currentTop + dy) + 'px';
            
            lastX = clientX;
            lastY = clientY;
        }

        function pararArraste() {
            if (itemArrastado) {
                itemArrastado.style.zIndex = 1;
                itemArrastado = null;
            }
        }

        document.getElementById('sala').addEventListener('mousedown', iniciarArraste);
        document.addEventListener('mousemove', arrastar);
        document.addEventListener('mouseup', pararArraste);

        document.getElementById('sala').addEventListener('touchstart', iniciarArraste, {passive: false});
        document.addEventListener('touchmove', arrastar, {passive: false});
        document.addEventListener('touchend', pararArraste);

        function girarItemSelecionado() {
            if (!itemSelecionado) {
                alert("Toque num item para o selecionar primeiro!");
                return;
            }
            let anguloAtual = parseInt(itemSelecionado.getAttribute('data-angle')) || 0;
            let novoAngulo = anguloAtual + 90;
            if (novoAngulo === 360) novoAngulo = 0;
            
            itemSelecionado.style.transform = `rotate(${novoAngulo}deg)`;
            itemSelecionado.setAttribute('data-angle', novoAngulo);
        }

        // NOVA FUNÇÃO: Remover Item
        function removerItemSelecionado() {
            if (!itemSelecionado) {
                alert("Toque num item para o selecionar primeiro!");
                return;
            }
            
            // Confirmação para evitar apagar sem querer
            if (confirm("Tem a certeza que deseja remover este item?")) {
                itemSelecionado.remove(); // Remove o elemento do ecrã
                itemSelecionado = null;   // Limpa a seleção
            }
        }

        function adicionarItem() {
            const nome = document.getElementById('nomeItem').value || "Item";
            const largura = parseInt(document.getElementById('larguraItem').value);
            const comprimento = parseInt(document.getElementById('comprimentoItem').value);

            if (!largura || !comprimento) {
                alert("Preencha a largura e o comprimento em centímetros!");
                return;
            }

            const sala = document.getElementById('sala');
            const novoElemento = document.createElement('div');
            
            novoElemento.className = 'item';
            novoElemento.innerText = nome;
            novoElemento.setAttribute('data-angle', '0');
            
            // Aplica a escala
            novoElemento.style.width = (largura * ESCALA) + 'px';
            novoElemento.style.height = (comprimento * ESCALA) + 'px';
            
            // Coloca no meio da sala
            novoElemento.style.left = '200px';
            novoElemento.style.top = '150px';
            
            // Cor aleatória
            novoElemento.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);

            sala.appendChild(novoElemento);
            
            // Limpa os campos
            document.getElementById('nomeItem').value = '';
            document.getElementById('larguraItem').value = '';
            document.getElementById('comprimentoItem').value = '';
        }
    </script>
</body>
</html>
